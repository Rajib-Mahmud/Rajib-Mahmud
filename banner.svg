<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,monospace">
  <defs>
    <!-- panel background gradient -->
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <!-- scan line gradient -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <!-- name accent underline gradient -->
    <linearGradient id="uline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <!-- soft cyan glow for the name -->
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
    <!-- clip so the scan line stays inside the panel -->
    <clipPath id="panelClip"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#panelBg)" stroke="#21262d" stroke-width="1.5"/>

  <g clip-path="url(#panelClip)">
    <!-- title bar -->
    <rect x="1" y="1" width="1198" height="46" fill="#10151c"/>
    <line x1="1" y1="47" x2="1199" y2="47" stroke="#21262d" stroke-width="1.5"/>
    <!-- window dots (double as severity palette) -->
    <circle cx="34" cy="24" r="6.5" fill="#f85149"/>
    <circle cx="56" cy="24" r="6.5" fill="#e3b341"/>
    <circle cx="78" cy="24" r="6.5" fill="#3fb950"/>
    <text x="104" y="29" font-size="14" fill="#6e7681">audit.log — rajib_mahmud</text>
    <!-- live indicator (pulsing) -->
    <circle cx="1058" cy="24" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1074" y="29" font-size="14" fill="#6e7681">auditing</text>

    <!-- line-number gutter (code-editor signal) -->
    <g font-size="13" fill="#2d333b" text-anchor="end">
      <text x="50" y="101">01</text>
      <text x="50" y="140">02</text>
      <text x="50" y="179">03</text>
      <text x="50" y="218">04</text>
      <text x="50" y="257">05</text>
    </g>
    <line x1="66" y1="60" x2="66" y2="288" stroke="#1b2027" stroke-width="1"/>

    <!-- command echo -->
    <text x="86" y="101" font-size="15" fill="#58a6ff" opacity="0.55">$ whitebox --audit ./source --verify-poc</text>

    <!-- hero name -->
    <text x="84" y="176" font-size="54" font-weight="700" fill="#e6edf3" filter="url(#glow)" letter-spacing="1">Rajib Mahmud</text>

    <!-- animated accent underline (draws once on load) -->
    <rect x="86" y="190" height="3" rx="1.5" fill="url(#uline)">
      <animate attributeName="width" from="0" to="470" dur="0.9s" begin="0.2s" fill="freeze"/>
    </rect>

    <!-- tagline + blinking cursor -->
    <text x="86" y="228" font-size="19" fill="#8b949e">Security Researcher · Bug Bounty Hunter · CTF Player</text>
    <rect x="612" y="214" width="10" height="18" fill="#38BDF8">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- status line (humble, on-brand) -->
    <text x="86" y="264" font-size="14" fill="#6e7681">reading source · verifying PoC · responsible disclosure</text>

    <!-- scanning sweep -->
    <rect x="1" y="48" width="1198" height="3" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,238; 0,0" dur="6s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </rect>
  </g>
</svg>
