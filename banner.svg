<g class="l" style="animation-delay:1.78s"><text x="30" y="182" class="ln">05</text><text x="78" y="182"><tspan class="ok">[+]</tspan> <tspan class="t">cyber security · bug bounty</tspan></text></g>
<g class="l" style="animation-delay:2.00s"><text x="30" y="208" class="ln">06</text><text x="78" y="208"><tspan class="ok">[+]</tspan> <tspan class="t">building automation systems &amp; tools</tspan></text></g>
<g class="l" style="animation-delay:2.22s"><text x="30" y="234" class="ln">07</text><text x="78" y="234"><tspan class="info">[*]</tspan> <tspan class="t">status: still learning</tspan></text></g>
<g class="l" style="animation-delay:2.44s"><text x="30" y="260" class="ln">08</text><text x="78" y="260"></text></g>
