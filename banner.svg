<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" width="1000" height="584" role="img" aria-label="whoami — Rajib Mahmud">
<style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#94a3b8;white-space:pre}
.ln{fill:#30363d;font-size:12px}
.u{fill:#38BDF8} .d{fill:#64748b} .w{fill:#e2e8f0}
.name{fill:#f8fafc;font-weight:700;font-size:17px}
.ok{fill:#22c55e} .warn{fill:#f59e0b} .info{fill:#38BDF8} .t{fill:#cbd5e1}
.hd{fill:#64748b;font-size:12px} .on{fill:#22c55e;font-size:12px}
.l{opacity:0;animation:in .3s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cur{fill:#38BDF8;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(524px)}}
@media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none}.scan{display:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1620"/></linearGradient>
<linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset="1" stop-color="#38BDF8" stop-opacity=".07"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="998" height="582" rx="12"/></clipPath>
</defs>
<rect x="1" y="1" width="998" height="582" rx="12" fill="url(#bg)" stroke="#21262d"/>
<g clip-path="url(#c)">
<rect x="0" y="0" width="1000" height="44" fill="#0b0f14"/>
<line x1="0" y1="44" x2="1000" y2="44" stroke="#21262d"/>
<circle cx="26" cy="22" r="6" fill="#ff5f56"/><circle cx="46" cy="22" r="6" fill="#ffbd2e"/><circle cx="66" cy="22" r="6" fill="#27c93f"/>
<text x="92" y="26" class="hd">session.log — rajib_mahmud</text>
<circle cx="888" cy="22" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="900" y="26" class="on">connected</text>
<line x1="62" y1="44" x2="62" y2="584" stroke="#161b22"/>
<rect class="scan" x="0" y="44" width="1000" height="60" fill="url(#sl)"/>
<g class="l" style="animation-delay:0.65s"><text x="30" y="78" class="ln">01</text><text x="78" y="78"><tspan class="u">rajib@dhaka</tspan><tspan class="d">:~$</tspan><tspan class="w" dx="9">whoami</tspan></text></g>
<g class="l" style="animation-delay:0.87s"><text x="30" y="104" class="ln">02</text><text x="78" y="104"><tspan class="name">Rajib Mahmud</tspan></text></g>
<g class="l" style="animation-delay:1.09s"><text x="30" y="130" class="ln">03</text><text x="78" y="130"></text></g>
