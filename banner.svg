<g class="l" style="animation-delay:3.13s"><text x="30" y="312" class="ln">10</text><text x="78" y="312"><tspan class="warn">[!]</tspan> <tspan class="t">no CS / engineering background</tspan></text></g>
<g class="l" style="animation-delay:3.35s"><text x="30" y="338" class="ln">11</text><text x="78" y="338"><tspan class="ok">[+]</tspan> <tspan class="t">political science student</tspan></text></g>
<g class="l" style="animation-delay:3.57s"><text x="30" y="364" class="ln">12</text><text x="78" y="364"><tspan class="ok">[+]</tspan> <tspan class="t">philosophy &amp; psychology — research interest</tspan></text></g>
<g class="l" style="animation-delay:3.79s"><text x="30" y="390" class="ln">13</text><text x="78" y="390"></text></g>
<g class="l" style="animation-delay:4.26s"><text x="30" y="416" class="ln">14</text><text x="78" y="416"><tspan class="u">rajib@dhaka</tspan><tspan class="d">:~$</tspan><tspan class="w" dx="9">cat addictions.txt</tspan></text></g>
<g class="l" style="animation-delay:4.48s"><text x="30" y="442" class="ln">15</text><text x="78" y="442"><tspan class="ok">[+]</tspan> <tspan class="t">CTFs</tspan></text></g>
<g class="l" style="animation-delay:4.70s"><text x="30" y="468" class="ln">16</text><text x="78" y="468"><tspan class="ok">[+]</tspan> <tspan class="t">trying new things · learning</tspan></text></g>
<g class="l" style="animation-delay:4.92s"><text x="30" y="494" class="ln">17</text><text x="78" y="494"><tspan class="ok">[+]</tspan> <tspan class="t">system access · bypasses</tspan></text></g>
<g class="l" style="animation-delay:5.14s"><text x="30" y="520" class="ln">18</text><text x="78" y="520"><tspan class="ok">[+]</tspan> <tspan class="t">anything I haven't broken yet</tspan></text></g>
<g class="l" style="animation-delay:5.56s"><text x="30" y="546" class="ln">19</text><text x="78" y="546"><tspan class="u">rajib@dhaka</tspan><tspan class="d">:~$</tspan></text><rect class="cur" x="216" y="531" width="10" height="19" rx="1"/></g>
</g>
</svg>
